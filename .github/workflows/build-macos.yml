name: Build Ghostty for macOS

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:  # 添加这个行以支持手动触发

jobs:
  build:
    runs-on: macos-13

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Zig
      run: |
        brew install zig

    - name: Build Ghostty
      run: |
        zig build -Doptimize=ReleaseFast -Dtarget=aarch64-macos

    - name: Build Mac App
      run: |
        cd macos && xcodebuild -arch arm64

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ghostty-macos
        path: macos/build/ReleaseLocal/Ghostty.app
